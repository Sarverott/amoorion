[project]
name = "amoorion"
version = "0.4.9a0"
description = "Universal tool for administration of chatting and communication platforms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sett Sarverott", email = "sett@sarverott.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
    "pykeepass>=4.2.0",
    "cryptography>=46.0.0",
    "nats-py>=2.10.0",
]

[project.scripts]
amoorion = "amoorion:main"

# Platform plugins, found through this group; the packages in packages/ add theirs the same way.
[project.entry-points."amoorion.plugins"]
dryrun = "amoorion.plugins.dryrun:DryRun"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "amoorion-blogger",
    "amoorion-bluesky",
    "amoorion-dev",
    "amoorion-discord",
    "amoorion-facebook",
    "amoorion-email",
    "amoorion-mastodon",
    "amoorion-ntfy",
    "amoorion-matrix",
    "amoorion-telegram",
    "amoorion-tumblr",
    "amoorion-x",
    "commitizen>=4.19.3",
    "gitpython>=3.2.1",
    "go-task-bin>=3.54.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "lefthook>=2.2.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pydrive>=1.3.1",
    "pygithub>=2.10.0",
    "pytest>=9.1.1",
    "yamllint>=1.38.0",
]
examples = [
    "marimo>=0.25.2",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
# CHANGELOG.md is written by `amoorion-dev version final`, not on every bump.
major_version_zero = true
# The flow merges release pull requests as "Release v<version>…" (Q15).
allowed_prefixes = ["Merge", "Revert", "Pull request", "fixup!", "squash!", "amend!", "Release v"]
# Every package has its own version, written by `amoorion-dev version` (Q15).

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "tools"]
# Test modules of several packages may share a name. Live tests post for
# real: left out unless asked for (task test:live).
addopts = ["--import-mode=importlib", "-m", "not live"]
markers = ["live: posts on a real platform account (task test:live -- <platform>…)"]

# Platform plugins, one package each (decision Q10).
[tool.uv.workspace]
members = [
    "packages/*",
    "tools/amoorion-dev",
    "docs",
]

[tool.uv.sources]
amoorion-bluesky = { workspace = true }
amoorion-email = { workspace = true }
amoorion-mastodon = { workspace = true }
amoorion-ntfy = { workspace = true }
amoorion-x = { workspace = true }
amoorion-tumblr = { workspace = true }
amoorion-blogger = { workspace = true }
amoorion-facebook = { workspace = true }
amoorion-discord = { workspace = true }
amoorion-telegram = { workspace = true }
amoorion-matrix = { workspace = true }
amoorion-dev = { workspace = true }
