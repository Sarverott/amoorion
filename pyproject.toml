[project]
name = "amoorion"
version = "0.1.0"
description = "Universal tool for administration of chatting and communication platforms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sett Sarverott", email = "sett@sarverott.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "mcp[cli]>=2.3.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
amoorion = "amoorion:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "go-task-bin>=3.54.0",
    "lefthook>=2.2.2",
    "pytest>=9.1.1",
    "yamllint>=1.38.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
testpaths = ["tests"]
