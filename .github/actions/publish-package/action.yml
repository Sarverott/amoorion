# One package of the workspace, published: built, attached to the GitHub
# release of its tag (the git package) and uploaded to PyPI. Called once per
# package by the publish workflow. PyPI creates only a few new projects an
# hour for an account; a 429 is waited out, and files already on PyPI are
# skipped, so publishing a tag again goes on where it stopped.
name: publish package
description: Build one package, attach it to the GitHub release, upload it to PyPI

inputs:
  package:
    description: name of the package, e.g. amoorion-bluesky
    required: true
  tag:
    description: the release, e.g. v0.3.0
    required: true
  github-token:
    description: token that may upload release assets
    required: true
  pypi-token:
    description: PyPI API token; empty skips PyPI
    required: false
    default: ''
  tries:
    description: how often to try PyPI while it answers 429
    required: false
    default: '12'
  pause:
    description: seconds between two tries
    required: false
    default: '900'

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6

    - name: Build ${{ inputs.package }}
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        TAG: ${{ inputs.tag }}
      run: |
        uv build --package "$PACKAGE" -o "dist/$PACKAGE"
        # The files must carry the release's version.
        if ! ls "dist/$PACKAGE" | grep -q -- "-${TAG#v}[-.]"; then
          echo "::error::$PACKAGE was not built as ${TAG#v}"
          exit 1
        fi

    - name: Attach to the release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PACKAGE: ${{ inputs.package }}
        TAG: ${{ inputs.tag }}
      run: gh release upload "$TAG" "dist/$PACKAGE"/* --clobber --repo "$GITHUB_REPOSITORY"

    - name: Upload to PyPI
      if: inputs.pypi-token != ''
      shell: bash
      env:
        UV_PUBLISH_TOKEN: ${{ inputs.pypi-token }}
        PACKAGE: ${{ inputs.package }}
        TRIES: ${{ inputs.tries }}
        PAUSE: ${{ inputs.pause }}
      run: |
        for try in $(seq "$TRIES"); do
          files=("dist/$PACKAGE"/*)
          check=https://pypi.org/simple/
          if uv publish --trusted-publishing never --check-url "$check" "${files[@]}" 2>&1 | tee log; then
            exit 0
          fi
          if ! grep -q "429" log || [ "$try" = "$TRIES" ]; then
            echo "::error::$PACKAGE was not uploaded to PyPI"
            exit 1
          fi
          echo "PyPI: too many new projects for now; $PACKAGE again in $PAUSE s ($try/$TRIES)"
          sleep "$PAUSE"
        done
