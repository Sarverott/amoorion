# The project's web page, made at every release (started by release.yml; by
# a release made by hand; or by hand for a tag): the page of amoorion-dev
# site with the examples built by marimo, committed by the bot onto the
# release's commit and force-pushed to the github-pages branch (as
# redscope.pl keeps its release branch), then deployed to GitHub Pages.
name: gh-pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: tag of the release to build the page of (empty = the latest release)
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  page:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Which release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          TAG=${TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: uv sync --frozen --group examples

      - name: Build the examples with marimo
        run: uv run --frozen task examples:build

      - name: Build the page
        run: uv run --frozen amoorion-dev site --out site --examples examples/build

      - name: Keep it in the github-pages branch
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          uv run -q --frozen amoorion-dev identity
          branch=$(uv run -q --frozen amoorion-dev setting branches.pages)
          git --work-tree site add --all
          git commit -q -m "web page of $TAG, UNIXUSAT=$(date +%s%3N)"
          git push origin "HEAD:$branch" --force

      # Only now: the branch above is kept even while Pages is off.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
