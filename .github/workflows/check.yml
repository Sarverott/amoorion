# Runs the same static checks as `task check` locally.
name: check

on:
  push:
    # The web page's branch holds built files only.
    branches-ignore: [github-pages]
  # To development only: from forks. The flow's pull requests to master would wait for an
  # approval nobody gives (made by a bot), and the flow runs `task check` before merging.
  pull_request:
    branches: [development]
  # Started by flow.yml for the commits it pushes (its token starts nothing by itself).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: check:commits reads every commit since commitizen.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: uv sync --frozen

      - name: Check
        run: uv run --frozen task check
