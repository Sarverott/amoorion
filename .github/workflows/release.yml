# A push to master (the merged pull request from development) releases the
# version it carries: development made it final (flow.yml) and wrote its
# CHANGELOG.md section, so nothing is committed here. The version is tagged
# v<version>, the GitHub release gets that section as notes, and the publish
# workflow builds and publishes the packages. Then pull master into
# development (task flow:pull), which marks the next pre-release.
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: uv sync --frozen

      - name: Check
        run: uv run --frozen task check

      - name: Is there a release to make?
        id: version
        run: |
          version=$(uv run -q --frozen amoorion-dev version current)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is released already"
          elif [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$version is a pre-release; development makes it final before it comes here (flow.yml)"
            exit 1
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag it and create the GitHub release
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          # Its section of CHANGELOG.md: from its heading to the next one.
          awk -v head="## $TAG " 'index($0, head) == 1 {on = 1; next} /^## v/ {on = 0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "amoorion $TAG" --notes-file notes.md --verify-tag
          # A release made with this token starts no workflow by itself.
          gh workflow run publish.yml --ref "$TAG" -f tag="$TAG"
