# A push to master (the merged pull request from development, or the flow
# merging a completed phase) releases the version it carries: development
# made it final (flow.yml) and wrote its CHANGELOG.md section, so nothing is
# committed here. The version is tagged v<version> by the bot; the GitHub
# release gets notes of the commits (CHANGELOG.md) and of the story added
# to docs/changelog/ since the last release (amoorion-dev notes); then the
# packages it bumped are published (publish.yml) and the web page is built
# (gh-pages.yml), both called from here. When they have ended, master is
# merged back into development and the next pre-release marked; pull it
# (git pull origin development).
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: uv sync --frozen

      - name: Check
        run: uv run --frozen task check

      - name: Is there a release to make?
        id: version
        run: |
          version=$(uv run -q --frozen amoorion-dev version current)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is released already"
          elif [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$version is a pre-release; development makes it final before it comes here (flow.yml)"
            exit 1
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag it and create the GitHub release
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          dev="uv run -q --frozen amoorion-dev"
          $dev identity
          git tag "$TAG"
          title=$($dev notes "$TAG" --title)
          $dev notes "$TAG" > notes.md
          git tag -f -a "$TAG" -m "$title"
          git push origin "$TAG"
          gh release create "$TAG" --title "$title" --notes-file notes.md --verify-tag

  publish:
    needs: release
    if: needs.release.outputs.tag
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write

  pages:
    needs: release
    if: needs.release.outputs.tag
    uses: ./.github/workflows/gh-pages.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write

  back:
    # After every workflow of the release, whatever they ended with.
    needs: [release, publish, pages]
    if: ${{ !cancelled() && needs.release.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: development
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: uv sync --frozen

      - name: Master back into development, the next pre-release marked
        # Pushed with this workflow's token, it starts no flow.
        run: |
          uv run -q --frozen amoorion-dev identity
          branch=$(uv run -q --frozen amoorion-dev setting branches.work)
          git merge --no-edit origin/master
          uv run --frozen amoorion-dev version mark
          git push origin "HEAD:$branch"
