# A push to development readies the next release and proposes it:
#   1. amoorion-dev version final: the pre-release X.Y.Za0 becomes the version
#      the commits since the last release ask for, with its CHANGELOG.md
#      section, committed as "bump: ..." and pushed back to development;
#   2. the pull request development → master is opened (or kept up to date),
#      and the checks run on what it carries;
#   3. the flow merges the pull request itself after `task check`: on every
#      push, or only when a phase of TODO.md got its last item ticked since
#      the last release (release.automerge in .github/flow.toml: always,
#      phase, never).
# Merging it releases (release.yml). docs/releasing.md has the whole loop.
name: flow

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: flow
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: development
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install tools
        run: uv sync --frozen

      - name: Anything to release?
        id: news
        # Merges and version bumps alone (master just pulled in and marked) are no release.
        run: |
          news=$(git log --no-merges --format=%s origin/master..HEAD | grep -cv '^bump:' || true)
          echo "commits=$news" >> "$GITHUB_OUTPUT"
          echo "$news commits on development that master hasn't got"

      - name: Final version of the next release
        id: final
        if: steps.news.outputs.commits != '0'
        run: |
          uv run -q --frozen amoorion-dev identity
          before=$(git rev-parse HEAD)
          uv run --frozen amoorion-dev version final
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            git push origin HEAD:development
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(uv run -q --frozen amoorion-dev version current)" >> "$GITHUB_OUTPUT"

      - name: Check the bump commit
        # Pushed with this workflow's token, it starts no check by itself.
        if: steps.final.outputs.bumped
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref development

      - name: Open the pull request to master
        id: pr
        if: steps.news.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.final.outputs.version }}
        run: |
          open=$(gh pr list --head development --base master --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh pr edit "$open" --title "Release v$VERSION"
            echo "pull request #$open is open, updated"
            echo "number=$open" >> "$GITHUB_OUTPUT"
          else
            body="Merging releases v$VERSION: tag, GitHub release with the packages, PyPI."
            body="$body See docs/releasing.md. Opened by the flow workflow."
            url=$(gh pr create --base master --head development --title "Release v$VERSION" --body "$body")
            echo "opened $url"
            echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release by itself
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          dev="uv run -q --frozen amoorion-dev"
          mode=$($dev setting release.automerge)
          completed=$($dev phases --completed)
          subject="Release v$($dev version current)${completed:+: phase $completed}"
          if [ "$mode" = always ] || { [ "$mode" = phase ] && [ -n "$completed" ]; }; then
            echo "automerge $mode${completed:+, completed: $completed}; checking, then merging #$PR"
            uv run --frozen task check
            gh pr merge "$PR" --merge --subject "$subject"
            # The merge made with this token starts no workflow by itself. It has happened
            # by now, so a hiccup of GitHub's must not leave master without its release.
            for try in 1 2 3 4 5; do
              gh workflow run release.yml --ref master && exit 0
              echo "release not started, try $try of 5"
              sleep 30
            done
            exit 1
          else
            echo "automerge $mode; the pull request waits for the author"
          fi
