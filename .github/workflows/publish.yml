# A release publishes every package of the workspace, one job each, by the
# local action .github/actions/publish-package: built, attached to the
# GitHub release, uploaded to PyPI with the PYPI_TOKEN of the `pypi`
# environment. Started by the release workflow, by a release made by hand,
# or by hand for a tag (optionally only some packages).
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: tag of the release to publish, e.g. v0.3.0
        required: true
      packages:
        description: only these packages, comma-separated (empty = all)
        required: false
        default: ''

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      tries: ${{ steps.list.outputs.tries }}
      pause: ${{ steps.list.outputs.pause }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v6

      - name: Packages to publish
        id: list
        env:
          ONLY: ${{ inputs.packages }}
        run: |
          dev="uv run -q --frozen --package amoorion-dev amoorion-dev"
          list=$($dev packages --only "$ONLY")
          echo "$list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "tries=$($dev setting pypi.tries)" >> "$GITHUB_OUTPUT"
          echo "pause=$($dev setting pypi.pause)" >> "$GITHUB_OUTPUT"

  package:
    needs: packages
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    # Waiting out PyPI's limit on new projects can take a while.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.list) }}
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.package.name }}/
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: ./.github/actions/publish-package
        with:
          package: ${{ matrix.package.name }}
          tag: ${{ env.TAG }}
          github-token: ${{ github.token }}
          pypi-token: ${{ secrets.PYPI_TOKEN }}
          tries: ${{ needs.packages.outputs.tries }}
          pause: ${{ needs.packages.outputs.pause }}
