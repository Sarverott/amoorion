# A release publishes every package of the workspace: built once, attached
# to the GitHub release (the git package), and uploaded to PyPI with the
# secret PYPI_TOKEN of the `pypi` environment.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: tag of the release to publish, e.g. v0.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v6

      - name: Build every package
        run: uv build --all-packages -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # PyPI lets an account create only a few new projects an hour; the first
    # release of every package waits out that limit here.
    timeout-minutes: 240
    environment:
      name: pypi
      url: https://pypi.org/project/amoorion/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v6

      - name: Upload to PyPI, one package at a time
        # bash with pipefail: a failing upload is not hidden by `tee`.
        shell: bash
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
          # Files already on PyPI are skipped, so a run started again goes on where one stopped.
          CHECK_URL: https://pypi.org/simple/
          TRIES: 12
          PAUSE: 900
        run: |
          packages=$(ls dist | sed -E 's/-[0-9][^-]*(-py3-none-any\.whl|\.tar\.gz)$//' | sort -u)
          for package in $packages; do
            for try in $(seq "$TRIES"); do
              files=(dist/"$package"-[0-9]*)
              if uv publish --trusted-publishing never --check-url "$CHECK_URL" "${files[@]}" 2>&1 | tee log; then
                break
              fi
              if ! grep -q "429" log || [ "$try" = "$TRIES" ]; then
                echo "::error::$package was not uploaded"
                exit 1
              fi
              echo "PyPI: too many new projects for now; $package again in $PAUSE s ($try/$TRIES)"
              sleep "$PAUSE"
            done
          done
