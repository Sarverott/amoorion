# A release publishes the packages it bumped (a Z release: amoorion and
# the changed ones; X or Y: all), one job each, by the local action
# .github/actions/publish-package: built, attached to the GitHub release,
# uploaded to PyPI with the PYPI_TOKEN of the `pypi` environment. Called by
# the release workflow; started by a release made by hand, or by hand for a
# tag (optionally other packages).
name: publish

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: tag of the release to publish, e.g. v0.3.0
        required: true
      packages:
        description: these packages, comma-separated (empty = the ones the release bumped, all = every one)
        required: false
        default: ''

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      tries: ${{ steps.list.outputs.tries }}
      pause: ${{ steps.list.outputs.pause }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Packages to publish
        id: list
        env:
          ONLY: ${{ inputs.packages }}
        run: |
          dev="uv run -q --frozen --package amoorion-dev amoorion-dev"
          case "$ONLY" in
            all) list=$($dev packages) ;;
            "") list=$($dev packages --released "$TAG") ;;
            *) list=$($dev packages --only "$ONLY") ;;
          esac
          echo "$list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "tries=$($dev setting pypi.tries)" >> "$GITHUB_OUTPUT"
          echo "pause=$($dev setting pypi.pause)" >> "$GITHUB_OUTPUT"

  package:
    needs: packages
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    # Waiting out PyPI's limit on new projects can take a while.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.list) }}
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.package.name }}/
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: ./.github/actions/publish-package
        with:
          package: ${{ matrix.package.name }}
          version: ${{ matrix.package.version }}
          tag: ${{ env.TAG }}
          github-token: ${{ github.token }}
          pypi-token: ${{ secrets.PYPI_TOKEN }}
          tries: ${{ needs.packages.outputs.tries }}
          pause: ${{ needs.packages.outputs.pause }}
