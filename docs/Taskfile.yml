# Docs of amoorion: Sphinx from the Markdown here, built on Read the Docs.
# Included by the root Taskfile as `docs:` (run from docs/).

version: '3'

vars:
  EXPORT: uv export --frozen --package amoorion-docs --no-dev --no-hashes --no-header

tasks:
  build:
    desc: Build the docs into docs/_build/html (warnings are errors), and check the PDF's sources
    cmds:
      - uv run --frozen --package amoorion-docs sphinx-build -W --keep-going -q -b html . _build/html
      # llms.txt links only in full (conf.py, _llms_absolute).
      - "! grep -rE '^- \\[[^]]*\\]\\([^h#)]' --include='llms*.txt' _build/html"
      - task: check:latex

  check:latex:
    desc: Check that the PDF of Read the Docs can be made (only the LaTeX sources; pdflatex isn't needed)
    # After docs:build, not beside it: both copy the notebooks in.
    cmds:
      - uv run --frozen --package amoorion-docs sphinx-build -q -b latex . _build/latex
      - python3 ../scripts/check-latex.py _build/latex/amoorion.tex

  requirements:
    desc: Write docs/requirements.txt for Read the Docs from uv.lock
    cmds:
      - '{{.EXPORT}} -o requirements.txt'

  check:requirements:
    desc: Check that docs/requirements.txt pins what uv.lock pins
    # Only the pins are compared: uv versions word comments and markers differently.
    vars:
      PINS: grep -v '^ *#' | sed 's/ *;.*//' | sort -u
    cmds:
      - >-
        diff -u <(cat requirements.txt | {{.PINS}}) <({{.EXPORT}} | {{.PINS}})
        || (echo "run: task docs:requirements" >&2; exit 1)
