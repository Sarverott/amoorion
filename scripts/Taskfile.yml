# What runs a script of this directory: the vault, a new plugin, the presentation page.
# Included by the root Taskfile.

version: '3'

tasks:
  vault:new:
    desc: 'KeePassXC: the file of AMOORION_VAULT_PATH and an empty entry per platform; values stay'
    cmds:
      - scripts/vault.sh new

  vault:login:
    desc: 'Bitwarden: log in and unlock; its session goes into .env (AMOORION_VAULT_TOKEN)'
    interactive: true
    cmds:
      - scripts/vault.sh login

  vault:lock:
    desc: 'Bitwarden: lock the vault and empty its session in .env'
    cmds:
      - scripts/vault.sh lock

  vault:status:
    desc: 'The vault of .env: its state, then which platforms have their secrets'
    cmds:
      - scripts/vault.sh status
      - uv run --frozen amoorion accounts

  plugin:new:
    desc: 'Start a plugin package: task plugin:new -- <platform> <ClassName> "<description>"'
    cmds:
      - scripts/new-plugin.sh {{.CLI_ARGS}}

  site:website:
    desc: Build the presentation page (amoorion-website, by npm and vite) into website/dist/ (not committed)
    cmds:
      - scripts/build-website.sh
