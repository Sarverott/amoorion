[project]
name = "amoorion-bluesky"
version = "0.4.4"
description = "Bluesky plugin of amoorion: post, read and reply through the AT Protocol"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sett Sarverott", email = "sett@sarverott.com" }
]
requires-python = ">=3.12"
dependencies = [
    "amoorion",
]

[project.urls]
Homepage = "https://github.com/Sarverott/amoorion"
Documentation = "https://amoorion.readthedocs.io/en/latest/platforms/bluesky.html"
Source = "https://github.com/Sarverott/amoorion/tree/master/packages/amoorion-bluesky"
Issues = "https://github.com/Sarverott/amoorion/issues"
Changelog = "https://github.com/Sarverott/amoorion/blob/master/CHANGELOG.md"

[project.entry-points."amoorion.plugins"]
bluesky = "amoorion_bluesky:Bluesky"

[tool.uv.sources]
amoorion = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
