[project]
name = "amoorion-mastodon"
version = "0.3.1"
description = "Mastodon plugin of amoorion: post, read and reply through the Mastodon REST API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sett Sarverott", email = "sett@sarverott.com" }
]
requires-python = ">=3.12"
dependencies = [
    "amoorion",
]

[project.entry-points."amoorion.plugins"]
mastodon = "amoorion_mastodon:Mastodon"

[tool.uv.sources]
amoorion = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
