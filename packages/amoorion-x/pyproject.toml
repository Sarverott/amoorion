[project]
name = "amoorion-x"
version = "0.4.4"
description = "X (twitter) plugin of amoorion: post, read and reply through the X API v2"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sett Sarverott", email = "sett@sarverott.com" }
]
requires-python = ">=3.12"
dependencies = [
    "amoorion",
    "requests-oauthlib>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Sarverott/amoorion"
Documentation = "https://amoorion.readthedocs.io/en/latest/platforms/x.html"
Source = "https://github.com/Sarverott/amoorion/tree/master/packages/amoorion-x"
Issues = "https://github.com/Sarverott/amoorion/issues"
Changelog = "https://github.com/Sarverott/amoorion/blob/master/CHANGELOG.md"

[project.entry-points."amoorion.plugins"]
x = "amoorion_x:X"

[tool.uv.sources]
amoorion = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
