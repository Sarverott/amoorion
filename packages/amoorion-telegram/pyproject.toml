[project]
name = "amoorion-telegram"
version = "0.4.5"
description = "Telegram plugin of amoorion: a bot posts, reads and replies in one chat through the Bot API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sett Sarverott", email = "sett@sarverott.com" }
]
requires-python = ">=3.12"
dependencies = [
    "amoorion",
]

[project.urls]
Homepage = "https://github.com/Sarverott/amoorion"
Documentation = "https://amoorion.readthedocs.io/en/latest/platforms/telegram.html"
Source = "https://github.com/Sarverott/amoorion/tree/master/packages/amoorion-telegram"
Issues = "https://github.com/Sarverott/amoorion/issues"
Changelog = "https://github.com/Sarverott/amoorion/blob/master/CHANGELOG.md"

[project.entry-points."amoorion.plugins"]
telegram = "amoorion_telegram:Telegram"

[tool.uv.sources]
amoorion = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
