[project]
name = "amoorion-matrix"
version = "0.2.2a0"
description = "Matrix plugin of amoorion: posts, reads and replies in one room through the client-server API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sett Sarverott", email = "sett@sarverott.com" }
]
requires-python = ">=3.12"
dependencies = [
    "amoorion",
]

[project.entry-points."amoorion.plugins"]
matrix = "amoorion_matrix:Matrix"

[tool.uv.sources]
amoorion = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
