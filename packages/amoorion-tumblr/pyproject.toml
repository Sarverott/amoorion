[project]
name = "amoorion-tumblr"
version = "0.1.0"
description = "Tumblr plugin of amoorion: post and read through the Tumblr API v2"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sett Sarverott", email = "sett@sarverott.com" }
]
requires-python = ">=3.12"
dependencies = [
    "amoorion",
    "requests-oauthlib>=2.0.0",
]

[project.entry-points."amoorion.plugins"]
tumblr = "amoorion_tumblr:Tumblr"

[tool.uv.sources]
amoorion = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
