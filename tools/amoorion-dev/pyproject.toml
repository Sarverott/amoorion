[project]
name = "amoorion-dev"
version = "0.0.0"
description = "Development tools of amoorion: the state of development, versions, phases, release notes, web page"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sett Sarverott", email = "sett@sarverott.com" }
]
requires-python = ">=3.12"
dependencies = [
    "amoorion",
    "gitpython>=3.2.1",
    "libcst>=1.9.0",
    "markdown-it-py>=4.0.0",
    "pydantic>=2",
    "rich>=15.0.0",
]

# Never published: only amoorion and packages/* are (docs/releasing.md).
[project.scripts]
amoorion-dev = "amoorion_dev.cli:main"

[tool.uv.sources]
amoorion = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
