# The example notebooks: `task examples:build`.
# Included by the root Taskfile.

version: '3'

tasks:
  build:
    desc: Build the example notebooks with marimo into examples/build/ (not committed)
    cmds:
      - scripts/build-examples.sh

  refresh:
    desc: 'Run the notebooks and save their outputs (task examples:refresh -- <notebook>…; none: all)'
    cmds:
      - uv run --frozen python scripts/refresh-examples.py {{.CLI_ARGS}}
